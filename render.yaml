services:
  - type: web
    runtime: node
    name: marketplace-backend
    rootDir: Backend
    plan: starter
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/ready
    buildFilter:
      paths:
        - Backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 6000
      - key: MONGO_URI
        sync: false
      - key: SEED_PRODUCT_OWNER_EMAIL
        sync: false
      - key: SEED_PRODUCT_COUNT
        value: 20
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRE
        value: 50m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: JWT_ACCESS_MS
        value: 900000
      - key: JWT_REFRESH_MS
        value: 604800000
      - key: REDIS_ENABLED
        value: false
      - key: REDIS_REQUIRED
        value: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        sync: false
      - key: REDIS_TLS_REJECT_UNAUTHORIZED
        value: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_API_VERSION
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_REDIRECT_URL
        sync: false

  - type: web
    runtime: static
    name: marketplace-frontend
    rootDir: Frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    previews:
      generation: automatic
    buildFilter:
      paths:
        - Frontend/**
        - render.yaml
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
