services:
  - type: web
    name: marketplace-fullstack
    env: docker
    dockerfilePath: ./Dockerfile.fullstack
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://your-render-app.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRE
        value: 50m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: JWT_ACCESS_MS
        value: 900000
      - key: JWT_REFRESH_MS
        value: 604800000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_API_VERSION
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
