services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' mongodb://127.0.0.1:27017/test | grep 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - marketplace

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - marketplace

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: 6000
      MONGO_URI: mongodb://mongodb:27017/marketplace
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "false"
      FRONTEND_URL: http://localhost,http://localhost:8080,http://frontend,http://nginx
      TRUST_PROXY_HOPS: 1
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('node:http');const req=http.get('http://127.0.0.1:6000/api/v1/ready',(res)=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    expose:
      - "6000"
    networks:
      - marketplace

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marketplace

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marketplace

  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      stripe listen
      --api-key "$STRIPE_SECRET_KEY"
      --forward-to http://backend:6000/api/v1/payments/webhook/stripe
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - marketplace

volumes:
  mongo_data:
  redis_data:

networks:
  marketplace:
    driver: bridge
